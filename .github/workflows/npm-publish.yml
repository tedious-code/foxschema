name: npm Publish

# Publishes the public `foxschema` CLI package (browser launcher + line commands).
# Trigger: version tag `v*`, GitHub Release published, or workflow_dispatch.
#
# Secrets:
#   NPM_TOKEN — Automation token with publish rights to the `foxschema` package

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v0.1.66). Empty = current ref.'
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # From the lockfile, and without dependency lifecycle scripts: this job
      # holds an npm publish token, so it is the worst place to run code a
      # dependency chose. build-gate builds the same artifacts this way.
      - name: Install workspace
        run: npm install --ignore-scripts

      - name: Build web UI + CLI
        run: |
          npm run build -w @foxschema/web
          npm run build -w @foxschema/cli

      - name: Prepare npm pack folder
        run: node apps/cli/scripts/prepare-publish.mjs

      - name: Publish to npm
        working-directory: apps/cli/npm-pack
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
