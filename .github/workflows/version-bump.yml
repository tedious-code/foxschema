name: Version Bump

# Runs on every push to main (i.e. every merged PR).
# Increments the patch (0.2.N → 0.2.N+1). Skipped for `chore: bump` / `chore: release` / `[no bump]`.
on:
  push:
    branches: [main]

jobs:
  bump:
    # Skip bot bumps and intentional release commits (e.g. 0.2.0).
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore: bump version')
          && !startsWith(github.event.head_commit.message, 'chore: release')
          && !contains(github.event.head_commit.message, '[no bump]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Use a PAT or the default GITHUB_TOKEN.
          # GITHUB_TOKEN is enough for pushing to non-protected branches.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Compute new version
        id: ver
        run: |
          # Skip intentional releases (merge commits rarely keep "chore: release"
          # as subject — also scan recent subjects / PR branch names).
          RECENT=$(git log -8 --pretty=%s)
          if echo "$RECENT" | grep -qiE '^chore: release|\[no bump\]'; then
            echo "Skipping bump (recent chore: release / [no bump])"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$RECENT" | grep -qiE 'Merge pull request .*release|Merge pull request .*0-2-0'; then
            echo "Skipping bump (release merge)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT=$(jq -r '.version' package.json)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          BUILD=$(echo "$CURRENT" | cut -d. -f3)
          NEW_BUILD=$((BUILD + 1))
          NEW="${MAJOR}.${MINOR}.${NEW_BUILD}"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEW"

      - name: Update package.json files
        if: steps.ver.outputs.skip != 'true'
        run: |
          V=${{ steps.ver.outputs.new }}
          for f in \
            package.json \
            packages/core/package.json \
            apps/web/package.json \
            apps/cli/package.json; do
            jq --arg v "$V" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Commit and push
        if: steps.ver.outputs.skip != 'true'
        run: |
          V=${{ steps.ver.outputs.new }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            packages/core/package.json \
            apps/web/package.json \
            apps/cli/package.json
          git commit -m "chore: bump version to $V [skip ci]"
          git push
